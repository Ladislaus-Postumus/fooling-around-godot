[package]
name = "fooling-around"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = "0.4"
rand = "0.10.3"

[profile.dev]
opt-level = 1 # gdext debug builds are notoriously slow at opt-level 0

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
redundant_test_prefix = "warn"

print_stdout = "warn"
print_stderr = "warn"
use_debug = "warn"
